name: Build & Package (Windows .exe & Linux)

on:
  push:
    branches: [ main, "feat/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux x64 Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenGL & X11 dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev

      - name: Configure & Build (Release)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Run Simulation Unit Tests
        run: ctest --test-dir build --output-on-failure

      - name: Package Linux Binary
        run: |
          mkdir -p dist/OpenCity-Linux-x64
          cp build/open_city dist/OpenCity-Linux-x64/
          cp README.md dist/OpenCity-Linux-x64/
          tar -czf OpenCity-Linux-x64.tar.gz -C dist OpenCity-Linux-x64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCity-Linux-x64
          path: OpenCity-Linux-x64.tar.gz

  build-windows:
    name: Windows x64 Standalone .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake (MSVC x64 Release)
        run: cmake -B build -A x64

      - name: Build Standalone open_city.exe
        run: cmake --build build --config Release --parallel

      - name: Run Simulation Unit Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package OpenCity-Windows-x64.zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/OpenCity-Windows-x64 | Out-Null
          Copy-Item build/Release/open_city.exe dist/OpenCity-Windows-x64/open_city.exe
          Copy-Item README.md dist/OpenCity-Windows-x64/README.md
          Compress-Archive -Path dist/OpenCity-Windows-x64/* -DestinationPath OpenCity-Windows-x64.zip -Force

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCity-Windows-x64
          path: OpenCity-Windows-x64.zip

  publish-release:
    name: Update Latest GitHub Release (.exe)
    needs: [build-linux, build-windows]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenCity-Windows-x64
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: OpenCity-Linux-x64
          path: release-assets

      - name: Create or Update Release v0.4.0
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          TAG_NAME="v0.4.0"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          cat <<'EOF' > release_notes.md
          ### 바로 실행하기 (Windows 10 / 11)
          1. 아래 **Assets**에서 **`OpenCity-Windows-x64.zip`** 파일을 다운로드합니다.
          2. 압축을 풀고 **`open_city.exe`** 를 더블클릭하면 별도 설치 없이 바로 실행됩니다!

          ### v0.4.0 주요 업데이트 (유선형 슈퍼카 모델링 · 경제/부동산/풀튜닝 · 사실적인 도시 리마스터)
          - **32-스테이션 유선형 3D 차량 모델링 전면 개편 (레고/박스형 탈피)**: 전 차종(신규 하이퍼카 `젠토르노 X`, `인서전트 VIP 방탄 SUV`, `코그노센티 S 세단` 등 총 9종)에 곡면 로프팅 차체, 볼륨 휀더 아치, 5-트윈 스포크 오목 단조 휠, 레드 브레이크 캘리퍼, 필러 프레임 곡면 유리창 및 파노라마 루프 적용
          - **돈으로 즐기는 4대 경제·성장 시스템 & 스마트폰(`[P]`)**:
            - **LUXURY AUTOS 슈퍼카 전시장 & 개인 차고 즉시 호출 (`[P]`)**: 차량 영구 구매 및 도로변 즉시 배달
            - **부동산 & 수익 사업장 6곳 매입**: 25초마다 자동 현금 배당 수익 지급 + 영구 특전(`최대 체력·방탄 증가`, `니트로 충전 2배`, `튜닝비 50% 할인`, `미션 보상 +25%` 등)
            - **PAY 'N' TUNE 풀튜닝 & 하부 LED 네온 언더글로우**: 터보 엔진 Lv 1~3, 방탄 차체·타이어 Lv 1~3, 하부 LED 네온 5색, 카본 GT 스포일러, 단조 휠 도금, 유광 메탈릭·무광 새틴 도색 (개인 차고 영구 저장)
            - **MODA 의상 부티크 & 중화기 2종 추가**: 3D 캐릭터 의상 6종(피격 데미지 감소 특전) 및 `컴뱃 중기관총`, 광역 폭발 `전술 폭발 런처` 추가
          - **사실적인 도시 디테일 & 선셋 해변·오션 피어 확장**: 1층 상가 쇼윈도·어닝·발코니·옥상 헬리패드, 차량 통과형 `GLOBE OIL` 주유소, `LUXURY AUTOS` 유리 전시장, `PULSE` 네온 나이트클럽, 서쪽 백사장 해변·인명구조대 타워·나무 오션 피어, 유리 버스정류장·가로수 화단·벤치·광고판 구현
          - **한글 폰트 아틀라스 완벽 보강**: 현대 한글 완성형 11,172자 전체(`가~힣`)를 무손실 2-패스 아틀라스로 로드하여 한글 깨짐(`?`) 현상 완전 해결
          EOF
          ls -la release-assets
          if gh release view "${TAG_NAME}" -R "${REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" release-assets/* --clobber -R "${REPO}"
          else
            gh release create "${TAG_NAME}" release-assets/* \
              -R "${REPO}" \
              --target "${SHA}" \
              --title "Open City C++ ${TAG_NAME} (Windows .exe & Linux)" \
              --notes-file release_notes.md
          fi
