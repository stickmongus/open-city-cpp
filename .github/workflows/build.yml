name: Build & Package (Windows .exe & Linux)

on:
  push:
    branches: [ main, "feat/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux x64 Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenGL & X11 dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev

      - name: Configure & Build (Release)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Run Simulation Unit Tests
        run: ctest --test-dir build --output-on-failure

      - name: Package Linux Binary
        run: |
          mkdir -p dist/OpenCity-Linux-x64
          cp build/open_city dist/OpenCity-Linux-x64/
          cp README.md dist/OpenCity-Linux-x64/
          tar -czf OpenCity-Linux-x64.tar.gz -C dist OpenCity-Linux-x64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCity-Linux-x64
          path: OpenCity-Linux-x64.tar.gz

  build-windows:
    name: Windows x64 Standalone .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake (MSVC x64 Release)
        run: cmake -B build -A x64

      - name: Build Standalone open_city.exe
        run: cmake --build build --config Release --parallel

      - name: Run Simulation Unit Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package OpenCity-Windows-x64.zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/OpenCity-Windows-x64 | Out-Null
          Copy-Item build/Release/open_city.exe dist/OpenCity-Windows-x64/open_city.exe
          Copy-Item README.md dist/OpenCity-Windows-x64/README.md
          Compress-Archive -Path dist/OpenCity-Windows-x64/* -DestinationPath OpenCity-Windows-x64.zip -Force

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCity-Windows-x64
          path: OpenCity-Windows-x64.zip

  publish-release:
    name: Update Latest GitHub Release (.exe)
    needs: [build-linux, build-windows]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenCity-Windows-x64
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: OpenCity-Linux-x64
          path: release-assets

      - name: Create or Update Release v0.9.1
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          TAG_NAME="v0.9.1"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          cat <<'EOF' > release_notes.md
          ### 바로 실행하기 (Windows 10 / 11)
          1. 아래 **Assets**에서 **`OpenCity-Windows-x64.zip`** 파일을 다운로드합니다.
          2. 압축을 풀고 **`open_city.exe`** 를 더블클릭하면 별도 설치 없이 바로 실행됩니다!

          ### v0.9.1 버그 수정 & 완성도 집중 폴리싱 (17건 전수 해결)
          - **3D 차량 모델링 · PBR 셰이더 · 이펙트 정밀 수정**:
            - **우측 니트로 화염 회전축 오타 수정**: 트렁크 위로 솟구치던 우측 니트로 불꽃을 수평 쌍발 애프터버너(외곽 블루 플레임 + 내부 화이트 코어 + 실시간 깜빡임)로 완벽 수정!
            - **차량 휠아치 타이어 관통 · 검정 휀더 돌출 · 둥둥 떠있던 레이싱 스트라이프 해결**: 반원형 휠하우스 컷아웃 & 내부 섀시 후퇴로 풀 조향(`±28°`)·로우다운 상태에서도 타이어 겹침 제로, 휀더 곡면에 밀착된 아치 라이너, 차체 보닛·지붕·트렁크 곡면을 정확히 감싸는 3D 곡면 듀얼 GT 스트라이프 메시 적용!
            - **차체 곡면 섀도우 아크네 줄무늬 제거**: 경사각(`N·L`) 기반 노멀 오프셋 & 바이어스로 차체 측면 그림자 얼룩 완벽 제거!
            - **1인칭 운전석(`Cockpit`) 램프/부두 주행 시 대시보드 가라앉음 버그 수정** & **실시간 6단 변속 RPM 연동 타코미터 바 적용**!
            - **해변 젖은 노면 반사(Wet Puddles)**가 바다 쪽으로 가짜 빌딩을 비추지 않도록 해안 마스킹 적용 & 3D 빗줄기가 카메라 바로 주변에 자연스럽게 내리도록 개선!
            - **차량 그림자·네온 언더글로우·타이어 스키드마크·GPS 화살표**가 부두(`0.24m`) 및 스턴트 점프대 경사면 높이를 정확히 추종하도록 수정, **사이버 네온 날개 팩 비대칭 회전 오타 수정**!
          - **도시 랜드마크 · 맵 배치 충돌 수정**:
            - **선셋 피어 스턴트 램프를 뚫고 자라던 야자수 제거** & 모든 스턴트 램프·부두·대관람차·인명구조탑·POI 주변 자동 충돌 회피 필터링 적용!
            - **선셋 피어 대관람차 & 인명구조탑 위치 재배치**: 부두 침범 완전 해소 + 원통형 허브·강철 스포크·유리창 곤돌라로 리얼리즘 업그레이드!
            - **고속도로 오버헤드 이정표 갠트리 양면 렌더링**: 남쪽 방향에서도 선명한 고속도로 방면 표지판·노선 실드·차선 화살표 표시!
          - **3D 물리 · 충돌 · 사운드 · UX 개선**:
            - **공중 비행 차량 3D 판정 완전 동기화**: 공중 점프 중인 차량 아래 ground 보행자 로드킬·소품 파괴·지상 탑승 버그 차단, 고지대/공중 차량에 대한 **3D 총기 레이캐스트·지붕 등반·경찰/갱단 예광탄·파괴 후 중력 추락 및 연기 높이** 완벽 일치!
            - **6단 변속기(`D1~D6`) RPM 연동 엔진 사운드**: 변속 시 실제 엔진 피치가 상승→하강하는 리얼한 기어 변속 사운드 구현!
            - **스마트폰(`[P]`) / 커스텀 스튜디오(`[K]`) 열람 중 좌클릭 오발 방지**, 스튜디오 차량 쇼룸 카메라 높이(`posY`) 동기화, **레이더 미니맵에 6개 스턴트 점프 램프 주황색 마커 추가**!
          EOF
          ls -la release-assets
          if gh release view "${TAG_NAME}" -R "${REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" release-assets/* --clobber -R "${REPO}"
          else
            gh release create "${TAG_NAME}" release-assets/* \
              -R "${REPO}" \
              --target "${SHA}" \
              --title "Open City C++ ${TAG_NAME} (Windows .exe & Linux)" \
              --notes-file release_notes.md
          fi

