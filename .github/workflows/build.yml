name: Build & Package (Android Vulkan .apk, Windows .exe & Linux)

on:
  push:
    branches: [ main, "feat/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux x64 Native Vulkan Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan & X11 dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libvulkan-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev

      - name: Configure & Build (Release)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Run Simulation Unit Tests
        run: ctest --test-dir build --output-on-failure

      - name: Package Linux Binary
        run: |
          mkdir -p dist/OpenCity-Linux-x64
          cp build/open_city dist/OpenCity-Linux-x64/
          cp -r assets dist/OpenCity-Linux-x64/
          cp README.md dist/OpenCity-Linux-x64/
          tar -czf OpenCity-Linux-x64.tar.gz -C dist OpenCity-Linux-x64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCity-Linux-x64
          path: OpenCity-Linux-x64.tar.gz

  build-windows:
    name: Windows x64 Standalone Vulkan .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake (MSVC x64 Release)
        run: cmake -B build -A x64

      - name: Build Standalone open_city.exe
        run: cmake --build build --config Release --parallel

      - name: Run Simulation Unit Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package OpenCity-Windows-x64.zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/OpenCity-Windows-x64 | Out-Null
          Copy-Item build/Release/open_city.exe dist/OpenCity-Windows-x64/open_city.exe
          Copy-Item -Recurse assets dist/OpenCity-Windows-x64/assets
          Copy-Item README.md dist/OpenCity-Windows-x64/README.md
          Compress-Archive -Path dist/OpenCity-Windows-x64/* -DestinationPath OpenCity-Windows-x64.zip -Force

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCity-Windows-x64
          path: OpenCity-Windows-x64.zip

  build-android:
    name: Android Universal Vulkan Signed .apk (arm64-v8a + armeabi-v7a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Android build tools & Korean font
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build zip python3 fonts-nanum

      - name: Ensure Android SDK Platform 34, Build-Tools & NDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="${SDK}/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_SDK_ROOT=${SDK}"
          ls -la "${SDK}" || true
          if [[ ! -f "${SDK}/platforms/android-34/android.jar" ]] && [[ -x "${SDKMANAGER}" ]]; then
            yes | "${SDKMANAGER}" "platforms;android-34"
          fi
          if ! ls -1d "${SDK}"/build-tools/* >/dev/null 2>&1 && [[ -x "${SDKMANAGER}" ]]; then
            yes | "${SDKMANAGER}" "build-tools;34.0.0"
          fi
          if ! ls -1d "${SDK}"/ndk/*/build/cmake/android.toolchain.cmake >/dev/null 2>&1 && [[ -x "${SDKMANAGER}" ]]; then
            yes | "${SDKMANAGER}" "ndk;27.1.12297006"
          fi

      - name: Build, Align & Sign Universal Vulkan APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="$(grep -m1 'project(open_city VERSION ' CMakeLists.txt | sed -E 's/.*VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          fi
          VER="${VER:-3.2.0}"
          IFS='.' read -r VMAJ VMIN VPAT <<< "${VER}"
          VCODE=$((10#${VMAJ:-3} * 100 + 10#${VMIN:-0} * 10 + 10#${VPAT:-0}))
          export ANDROID_VERSION_NAME="${VER}"
          export ANDROID_VERSION_CODE="${VCODE}"
          export APK_OUTPUT="${GITHUB_WORKSPACE}/OpenCity-Android-v${VER}.apk"
          echo "Building signed Vulkan APK: ${APK_OUTPUT} (versionCode=${VCODE})"
          chmod +x tools/build_android_apk.sh tools/gen_android_icons.py tools/gen_korean_glyphs.py
          ./tools/build_android_apk.sh

      - name: Upload Android Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCity-Android
          path: OpenCity-Android-v*.apk

  publish-release:
    name: Publish GitHub Release (Android Vulkan .apk, Windows .exe & Linux)
    needs: [build-linux, build-windows, build-android]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    concurrency:
      group: publish-release-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenCity-Android
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: OpenCity-Windows-x64
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: OpenCity-Linux-x64
          path: release-assets

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          APK_FILE="$(basename "$(ls -1 release-assets/OpenCity-Android-v*.apk | head -n 1)")"
          TAG_NAME="v${APK_FILE#OpenCity-Android-v}"
          TAG_NAME="${TAG_NAME%.apk}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          cat <<EOF > release_notes.md
          ### Android 스마트폰/태블릿 바로 설치하기 (\`.apk\` — 네이티브 Vulkan 정식 서명 완료)
          1. 아래 **Assets**에서 **\`${APK_FILE}\`** 파일을 스마트폰으로 다운로드합니다.
          2. 다운로드한 APK를 탭해 설치합니다 *(기존 v2.x / v1.x 위에도 동일 인증서로 덮어쓰기 업데이트 가능!)*.
          3. **유니버설 바이너리(\`arm64-v8a\` + \`armeabi-v7a\`)** · Android 7.0 (API 24) ~ Android 15+ (16KB 페이지 정렬 지원) · **네이티브 Vulkan 1.0+** 엔진으로 구동됩니다!

          ### Windows PC 바로 실행하기 (Windows 10 / 11)
          1. 아래 **Assets**에서 **\`OpenCity-Windows-x64.zip\`** 파일을 다운로드합니다.
          2. 압축을 풀고 **\`open_city.exe\`** 를 더블클릭하면 Vulkan 3D 엔진으로 바로 실행됩니다! *(같은 폴더의 \`assets/\`를 유지해주세요)*

          ### ${TAG_NAME} 전 서울 고가교·입체교차로·교각·옹벽 전면 정비 & 구조물/차량 AI 전수 보정
          - **0. 서울 전역 48,380개 도로 · 3,161개 OCRM 청크 고가교·램프·교각 1:1 전면 정비 (`polish_seoul_bridges_v65.py`)**:
            - **전 서울 고가교 최소 형고 `≥ 4.8m` 확보 (`raised_bridges=362`)**: 반포IC(사평대로)·서초IC(서초대로) 등 하부 도로를 가로막던 저형고 고가교를 한국 고속도로 기준(`상판 간 ≥ 5.85m`, 하부 통과고 `≥ 4.80m`)으로 상향하고 박스거더 깊이를 정밀 슬림화했습니다.
            - **790곳 고가교 수직 절벽 단차 해소 & 콘크리트 옹벽·2,732기 한국형 T-교각(코핑) 시공**: 고가교와 지상 고속도로 접속부(`790곳`)를 C¹ 코사인 램프(고속도로·교량 경사 `≤ 9.0%`, 간선 `≤ 10.5%` 립시츠 보장)로 매끄럽게 연결하고, 접속부 하부 콘크리트 옹벽과 하부 차선을 피하는 **2,732기 한국형 해머헤드 T-교각+코핑**을 전 서울에 배치했으며, 횡단보도·교차로를 침범하던 방음벽(`7,074` 삼각형)을 제거했습니다.
          - **1. 전 서울 18개 권역 거리 구조물·가로수 OCRM 아스팔트 침범 `0건` & 야간 교량 광원 차단 (`CityMap.cpp` · `world.frag`)**:
            - 모든 버스정류장·지하철 출입구·가로판매대·벤치·한전 배전함·신호등·가로등·가로수 보호판에 4코너 OCRM 아스팔트 검사 및 횡단보도/교차로 이격 규칙을 적용하고, 고가도로 가로등이 하부 교차 도로로 스냅되던 `evalDeckY` 층간 오차를 완전 차단했습니다.
            - `world.frag`에 가로등 하향 컷오프·전조등 상향 차단을 적용해 야간 고가교 하부의 비현실적 원형 스포트라이트 빛샘을 제거했습니다.
          - **2. 차량 AI 보도 침범 억제 & 대형 거리 구조물 OBB 충돌 구현 (`GameWorld.cpp`)**:
            - 가로판매대·버스정류장·지하철 출입구·한전 배전함·따릉이 거치대에 차량 정밀 OBB 충돌을 추가하고, NPC 교통 차량이 OCRM 보도 광장으로 이탈하지 않도록 실시간 차선 복귀 조향 및 교량/지상 층간 연속성 가드를 적용했습니다.
          - **3. 43개 자동화 테스트(Release + ASan/UBSan) 100% 통과 · Android 16KB ELF · Native Vulkan 1.0+**:
            - `v6.4.0` 실제 서울 보도블럭·30cm 점자블록·반투명 강화유리 및 `v6.5.0` 전 서울 고가교/교각/OCRM 구조물 침범 0건 테스트(#43)까지 전수 통과 및 Mesa Lavapipe 1440×864 육안 검증을 완료했습니다.
          - **공식 25년 RSA-4096 릴리스 서명 인증서 (APK Signature Scheme v2 + v3)**:
            - 패키지명: \`com.stickmongus.opencity\` · **SHA-256**: \`6C:9B:7E:D9:1E:60:AA:E2:E9:B3:2F:70:D6:D9:F1:A1:EB:A4:86:05:6D:35:8E:00:C9:75:EF:28:3C:41:A9:5E\`
          EOF
          ls -la release-assets
          if gh release view "${TAG_NAME}" -R "${REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" release-assets/* --clobber -R "${REPO}"
            gh release edit "${TAG_NAME}" -R "${REPO}" \
              --title "Open City Seoul ${TAG_NAME} (Native Vulkan Android .apk, Windows .exe & Linux)" \
              --notes-file release_notes.md
          else
            gh release create "${TAG_NAME}" release-assets/* \
              -R "${REPO}" \
              --target "${SHA}" \
              --title "Open City Seoul ${TAG_NAME} (Native Vulkan Android .apk, Windows .exe & Linux)" \
              --notes-file release_notes.md
          fi
