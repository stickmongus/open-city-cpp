name: Build & Package (Windows .exe & Linux)

on:
  push:
    branches: [ main, "feat/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux x64 Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenGL & X11 dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev

      - name: Configure & Build (Release)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Run Simulation Unit Tests
        run: ctest --test-dir build --output-on-failure

      - name: Package Linux Binary
        run: |
          mkdir -p dist/OpenCity-Linux-x64
          cp build/open_city dist/OpenCity-Linux-x64/
          cp README.md dist/OpenCity-Linux-x64/
          tar -czf OpenCity-Linux-x64.tar.gz -C dist OpenCity-Linux-x64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCity-Linux-x64
          path: OpenCity-Linux-x64.tar.gz

  build-windows:
    name: Windows x64 Standalone .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake (MSVC x64 Release)
        run: cmake -B build -A x64

      - name: Build Standalone open_city.exe
        run: cmake --build build --config Release --parallel

      - name: Run Simulation Unit Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package OpenCity-Windows-x64.zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/OpenCity-Windows-x64 | Out-Null
          Copy-Item build/Release/open_city.exe dist/OpenCity-Windows-x64/open_city.exe
          Copy-Item README.md dist/OpenCity-Windows-x64/README.md
          Compress-Archive -Path dist/OpenCity-Windows-x64/* -DestinationPath OpenCity-Windows-x64.zip -Force

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCity-Windows-x64
          path: OpenCity-Windows-x64.zip

  publish-release:
    name: Update Latest GitHub Release (.exe)
    needs: [build-linux, build-windows]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenCity-Windows-x64
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: OpenCity-Linux-x64
          path: release-assets

      - name: Create or Update Release v0.7.0
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          TAG_NAME="v0.7.0"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          cat <<'EOF' > release_notes.md
          ### 바로 실행하기 (Windows 10 / 11)
          1. 아래 **Assets**에서 **`OpenCity-Windows-x64.zip`** 파일을 다운로드합니다.
          2. 압축을 풀고 **`open_city.exe`** 를 더블클릭하면 별도 설치 없이 바로 실행됩니다!

          ### v0.7.0 주요 업데이트 (무기 11종 대규모 확충 · 광학 저격 스코프 · 3D 차량 16종 풀 라인업)
          - **신규 총기 4종 추가 (`총 7종 -> 11종`, `[1]~[9]`, `[0]`, `[-]` 및 `Z`/`X`·마우스 휠 교체, 1·3인칭 3D 모델 & 전용 합성 총성 완비)**:
            - **`44 매그넘 리볼버 (.44 Magnum)`**: 브러시드 크롬 6연발 대구경 핸드캐논 (`피해량 88`, 고배율 헤드샷 결정력, `AMMU-TECH [9]`)
            - **`전자동 드럼 샷건 (Assault Drum Shotgun)`**: 16발 대형 드럼탄창 기반 12게이지 전자동 연사 산탄총 (`6펠릿 × 18`, `AMMU-TECH [0]` / 스마트폰 보급 `[8]`)
            - **`전술 저격소총 (Marksman Sniper Rifle)`**: 초장거리(`195m`, `피해량 148`) 정밀 저격소총! 우클릭(`RMB`) 시 **`24°` 3.2배율 광학 밀닷(Mil-Dot) 스코프 & 실시간 레이저 거리측정기(`RNG`) HUD** 및 자동 감도 감속(`0.28x`) 작동 (`AMMU-TECH [-]` / 스마트폰 보급 `[9]`)
            - **`6열 개틀링 미니건 (Vulcan 6-Barrel Minigun)`**: 분당 약 1,400발(`200발 벨트 드럼`)을 퍼붓는 초고속 중화기! 조준·사격 시 **1인칭·3인칭 6열 총열 클러스터가 실시간 고속 회전** (`AMMU-TECH [=]` / 스마트폰 보급 `[0]`)
          - **신규 32-스테이션 곡면 스컬프팅 3D 차량 6종 추가 (`총 10종 -> 16종`, 전 차종 1인칭 운전석·보닛 완비)**:
            - **`샌드킹 4x4 픽업트럭 (SANDKING 4X4)`**: 대구경 오프로드 타이어, 오목하게 파인 리얼 적재함(Cargo Bed), 강철 불바, 바하 롤바 & 루프 4연장 LED 서치라이트 (`전시장/스마트폰 [7]`)
            - **`코케트 오픈 로드스터 (COQUETTE ROADSTER)`**: 오픈탑 컨버터블 스포츠카! 개방형 가죽 버킷시트 인테리어, 크롬 트윈 롤후프, 듀얼 GT 레이싱 스트라이프 & 하늘이 탁 트인 오픈 운전석 시야 (`전시장/스마트폰 [8]`)
            - **`설탄 RS 드리프트 튜너 (SULTAN RS TUNER)`**: 전면 노출형 알루미늄 인터쿨러(`FMIC`), 랠리 루프 스쿱, 와이드바디 립 & 드리프트 보너스 특화 세팅 (`전시장/스마트폰 [9]`)
            - **`발키리 LMP 트랙카 (VALKYRIE LMP-R)`**: 중앙 도살 샤크핀(Dorsal Shark-Fin), 눈물방울 캐노피, 시안 에어로 스플리터를 갖춘 초고속(`순정 207 km/h` / `풀튜닝 265+ km/h`) 르망 하이퍼 프로토타입 (`전시장/스마트폰 [0]`)
            - **`선셋베이 119 구급차 (PARAMEDIC EMS)`**: 화이트·크림슨 메디컬 박스밴, 측면·루프 적십자(`+`) 엠블럼, 레드/화이트 경광등(`G` 키 사이렌) + **탑승 시 구급키트로 체력 `+35 HP` 즉시 회복**!
            - **`선셋베이 중형 소방차 (SBFD FIRE ENGINE)`**: 중량급(`4,200kg`, 체력 `520`) 소방 엔진 트럭, 크롬 전면 범퍼, 측면 알루미늄 셔터 베이, 루프 연장 사다리 랙 & 레드/앰버 경광등(`G` 키 사이렌)
          EOF
          ls -la release-assets
          if gh release view "${TAG_NAME}" -R "${REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" release-assets/* --clobber -R "${REPO}"
          else
            gh release create "${TAG_NAME}" release-assets/* \
              -R "${REPO}" \
              --target "${SHA}" \
              --title "Open City C++ ${TAG_NAME} (Windows .exe & Linux)" \
              --notes-file release_notes.md
          fi
