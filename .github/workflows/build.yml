name: Build & Package (Windows .exe & Linux)

on:
  push:
    branches: [ main, "feat/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux x64 Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenGL & X11 dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev

      - name: Configure & Build (Release)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Run Simulation Unit Tests
        run: ctest --test-dir build --output-on-failure

      - name: Package Linux Binary
        run: |
          mkdir -p dist/OpenCity-Linux-x64
          cp build/open_city dist/OpenCity-Linux-x64/
          cp README.md dist/OpenCity-Linux-x64/
          tar -czf OpenCity-Linux-x64.tar.gz -C dist OpenCity-Linux-x64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCity-Linux-x64
          path: OpenCity-Linux-x64.tar.gz

  build-windows:
    name: Windows x64 Standalone .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake (MSVC x64 Release)
        run: cmake -B build -A x64

      - name: Build Standalone open_city.exe
        run: cmake --build build --config Release --parallel

      - name: Run Simulation Unit Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package OpenCity-Windows-x64.zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/OpenCity-Windows-x64 | Out-Null
          Copy-Item build/Release/open_city.exe dist/OpenCity-Windows-x64/open_city.exe
          Copy-Item README.md dist/OpenCity-Windows-x64/README.md
          Compress-Archive -Path dist/OpenCity-Windows-x64/* -DestinationPath OpenCity-Windows-x64.zip -Force

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCity-Windows-x64
          path: OpenCity-Windows-x64.zip

  publish-release:
    name: Update Latest GitHub Release (.exe)
    needs: [build-linux, build-windows]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenCity-Windows-x64
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: OpenCity-Linux-x64
          path: release-assets

      - name: Create or Update Release v0.8.0
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          TAG_NAME="v0.8.0"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          cat <<'EOF' > release_notes.md
          ### 바로 실행하기 (Windows 10 / 11)
          1. 아래 **Assets**에서 **`OpenCity-Windows-x64.zip`** 파일을 다운로드합니다.
          2. 압축을 풀고 **`open_city.exe`** 를 더블클릭하면 별도 설치 없이 바로 실행됩니다!

          ### v0.8.0 주요 업데이트 (`[K]` 통합 4탭 커스텀 스튜디오: 캐릭터 · 총기 건스미스 · 차량 풀커스텀 · 조준선/HUD)
          - **`[K]` 통합 커스텀 스튜디오 & 실시간 3D 쇼룸 카메라 (`[Q]`/`[E]` 탭 전환, 마우스 360° 회전 감상)**:
            - 언제 어디서나 **`K` 키** 하나로 캐릭터·총기·차량·조준선/HUD를 실시간으로 꾸미고 즉시 게임플레이와 1·3인칭 3D 그래픽에 반영!
          - **탭 1 — 캐릭터 커스텀 (`CHARACTER`, `[1]~[8]`, 1·3인칭 동시 반영)**:
            - **헤어·헤드기어 3D 모델 7종**: 클래식 숏컷, 슬릭 포마드, 모호크, 스냅백 캡, **풀페이스 에어로 헬멧(`받는 피해 -8%` 방어 보너스)**, 사이버 네온 바이저, **24K VIP 골드 크라운** + 헤어/모자 컬러 6종
            - **아이웨어 4종**(선글라스·골드 에비에이터·사이버 전술 고글), **피부 톤 5종**(1인칭 FPS 팔·운전석 핸들 손 동시 적용), **상의 컬러 9종 & 하의 컬러 7종**, **3D 등 액세서리 4종**(전술 백팩·하이스트 더플백·사이버 네온 윙팩)
          - **탭 2 — 총기 건스미스 (`GUNSMITH`, `[1]~[6]`, 무기별 개별 저장)**:
            - **총기 스킨 6종**: 팩토리 블랙, 브러시드 크롬, **24K 로얄 골드**, 크림슨 카본, **사이버 네온**, 아틱 화이트아웃
            - **전술 소음기 (`Suppressor`)**: 1·3인칭 3D 총구 소음기 장착 + 전용 묵직한 소음 총성 합성 + 탄퍼짐 `-15%` + **사격 시 경찰 수배 열기 약 80% 감소 & 시민 패닉 반경 대폭 축소**
            - **대용량 확장 탄창 (`Extended Mag`)**: **장탄수 `+50%` 증가**(카빈 `30 -> 45발`, 미니건 `200 -> 300발` 등) + 3D 대형 탄창 외형 반영
            - **3D 전술 레이저 사이트 (`Red / Green / Cyan`)**: 총열에서 표적까지 실시간 3D 레이저 빔 & 레이저 포인트 조사 + **지향사격 집탄율 `+30%` 향상**
            - **예광탄 컬러 6종** & **1인칭 도트/3.2배율 저격 스코프 레티클 색상 5종** 커스텀
          - **탭 3 — 차량 풀 커스텀 (`VEHICLE STUDIO`, `[1]~[8]`, 개인 차고 영구 저장)**:
            - **미러 실버 크롬 & 24K 골드 크롬** 포함 12종 도색·랩핑 + **듀얼 GT 레이싱 스트라이프 5종** + **단조 휠 5종**
            - **리어 에어로 윙 3종**(`스완넥 타임어택 대형 윙` 장착 시 **코너링 그립 `+6%`**) + **서스펜션 차고·슬램드 마이너스 캠버(`-8.5°`) 4단계** (`-45mm` 로우다운 / `-82mm` 캠버 / `+95mm` 오프로드 리프트업)
            - **헤드라이트·야간 조사광 컬러 5종**, **하부 LED 네온 언더글로우 6종**, **컬러 드리프트 타이어 연기 6종**
          - **탭 4 — 조준선 & HUD 커스텀 (`HUD / AIM`, `[1]~[6]`)**:
            - **조준선 모양 4종**(십자+도트 / 핀포인트 도트 / 택티컬 서클 / 쉐브론) × **컬러 6종** × **크기 3단계** × **외곽선 ON/OFF**, 속도계 단위(`KM/H` ↔ `MPH`), **HUD 테마 컬러 4종**
          EOF
          ls -la release-assets
          if gh release view "${TAG_NAME}" -R "${REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" release-assets/* --clobber -R "${REPO}"
          else
            gh release create "${TAG_NAME}" release-assets/* \
              -R "${REPO}" \
              --target "${SHA}" \
              --title "Open City C++ ${TAG_NAME} (Windows .exe & Linux)" \
              --notes-file release_notes.md
          fi
