name: Build & Package (Windows .exe & Linux)

on:
  push:
    branches: [ main, "feat/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux x64 Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenGL & X11 dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev

      - name: Configure & Build (Release)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Run Simulation Unit Tests
        run: ctest --test-dir build --output-on-failure

      - name: Package Linux Binary
        run: |
          mkdir -p dist/OpenCity-Linux-x64
          cp build/open_city dist/OpenCity-Linux-x64/
          cp README.md dist/OpenCity-Linux-x64/
          tar -czf OpenCity-Linux-x64.tar.gz -C dist OpenCity-Linux-x64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCity-Linux-x64
          path: OpenCity-Linux-x64.tar.gz

  build-windows:
    name: Windows x64 Standalone .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake (MSVC x64 Release)
        run: cmake -B build -A x64

      - name: Build Standalone open_city.exe
        run: cmake --build build --config Release --parallel

      - name: Run Simulation Unit Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package OpenCity-Windows-x64.zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/OpenCity-Windows-x64 | Out-Null
          Copy-Item build/Release/open_city.exe dist/OpenCity-Windows-x64/open_city.exe
          Copy-Item README.md dist/OpenCity-Windows-x64/README.md
          Compress-Archive -Path dist/OpenCity-Windows-x64/* -DestinationPath OpenCity-Windows-x64.zip -Force

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCity-Windows-x64
          path: OpenCity-Windows-x64.zip

  publish-release:
    name: Update Latest GitHub Release (.exe)
    needs: [build-linux, build-windows]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenCity-Windows-x64
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: OpenCity-Linux-x64
          path: release-assets

      - name: Create or Update Release v0.9.0
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          TAG_NAME="v0.9.0"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          cat <<'EOF' > release_notes.md
          ### 바로 실행하기 (Windows 10 / 11)
          1. 아래 **Assets**에서 **`OpenCity-Windows-x64.zip`** 파일을 다운로드합니다.
          2. 압축을 풀고 **`open_city.exe`** 를 더블클릭하면 별도 설치 없이 바로 실행됩니다!

          ### v0.9.0 주요 업데이트 (폴리글랏 `C++20 + Rust + Python 3 + GLSL 330` 리얼리즘 대업데이트: PBR 그래픽 · 물리엔진 · 랜드마크 구조물 · 정밀 차량)
          - **폴리글랏 4대 언어 하이브리드 아키텍처 (`C++20` + `Rust` + `Python 3` + `GLSL 330`)**:
            - **Rust (`#![no_std]` `src/physics/physics_kernel.rs`)**: 6단 자동변속기(`D1~D6`/`R`)·실시간 RPM 타코미터, 4륜 독립 스프링-댐퍼 서스펜션, Pacejka 타이어 슬립, 3D 스턴트 점프 비행 물리, 회전 충돌 임펄스(`r × J` PIT 매뉴버 스핀아웃), 4분면 차체 크럼플 변형, 3D 거리 소품 물리 파괴 & 소화전 물기둥 분출!
            - **Python 3 (`tools/generate_realistic_assets.py`)**: 16종 차량 정밀 3D CAD 스플라인, 금문교 스타일 현수교 현수선(`Catenary Curve`), 대관람차 3D 스포크 링, 16-Tap 푸아송 소프트 그림자 커널, 도시 전역 6개 스턴트 점프 램프 자동 생성!
            - **GLSL 330 Cook-Torrance GGX 마이크로패싯 PBR 셰이더 (`src/render/Renderer3D.cpp`)**: 빌딩 유리창 내부에 실제 3D 방·천장 조명·가구·블라인드가 깊이감 있게 비치는 **3D Raycasted Interior Mapping**, **360° 3D 스카이라인·네온 반사맵**, **`[U]` 우천 날씨 & 젖은 아스팔트 노면 거울 반사(Wet Road Mirror Puddles)**, **16-Tap 푸아송 소프트 그림자**!
          - **초사실적 3D 도시 랜드마크 구조물 5종 & 건축 입면 필라스터 디테일**:
            - **골든 베이 현수교 (`Golden Bay Suspension Bridge`)**: 북부 해안을 가로지르는 42m H형 주탑 2기 + 현수선 메인 케이블 + 수직 행어 와이어 + 4차선 교량 데크
            - **선셋 피어 네온 대관람차 (`Sunset Pier Ferris Wheel`)**: 서부 해변에서 실시간 회전하는 12개 네온 곤돌라 캐빈 & 트러스 A-프레임
            - **항구 컨테이너 갠트리 크레인 (`Harbor Gantry Cranes`)**, **대로변 오버헤드 고속도로 이정표 갠트리**, **도시 전역 6개 3D 네온 쉐브론 스턴트 점프대 (`체공 현금 보너스 지급`)**
          - **초정밀 3D 차량 디테일 & 실시간 물리 변형 (`16종 전 차량 적용`)**:
            - **전면 허니콤 라디에이터 그릴·크롬 서라운드·코너 에어 인테이크**, **3D 프로젝터 헤드라이트 베젤·LED DRL 아이브로우**, **플러시 도어 핸들·B필러 트림·윈드실드 와이퍼**
            - **실시간 4륜 서스펜션 스트로크(`wheelCompression`)**, **충돌 부위별(`앞·뒤·좌·우`) 보닛·범퍼가 실제로 들리고 찌그러지는 4분면 크럼플 변형**, **6단 자동변속 기어(`D1~D6`/`R`/`AIR`) 및 RPM 게이지 HUD**
          EOF
          ls -la release-assets
          if gh release view "${TAG_NAME}" -R "${REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" release-assets/* --clobber -R "${REPO}"
          else
            gh release create "${TAG_NAME}" release-assets/* \
              -R "${REPO}" \
              --target "${SHA}" \
              --title "Open City C++ ${TAG_NAME} (Windows .exe & Linux)" \
              --notes-file release_notes.md
          fi

