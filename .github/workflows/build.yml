name: Build & Package (Windows .exe & Linux)

on:
  push:
    branches: [ main, "feat/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux x64 Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenGL & X11 dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev

      - name: Configure & Build (Release)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Run Simulation Unit Tests
        run: ctest --test-dir build --output-on-failure

      - name: Package Linux Binary
        run: |
          mkdir -p dist/OpenCity-Linux-x64
          cp build/open_city dist/OpenCity-Linux-x64/
          cp README.md dist/OpenCity-Linux-x64/
          tar -czf OpenCity-Linux-x64.tar.gz -C dist OpenCity-Linux-x64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCity-Linux-x64
          path: OpenCity-Linux-x64.tar.gz

  build-windows:
    name: Windows x64 Standalone .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake (MSVC x64 Release)
        run: cmake -B build -A x64

      - name: Build Standalone open_city.exe
        run: cmake --build build --config Release --parallel

      - name: Run Simulation Unit Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package OpenCity-Windows-x64.zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/OpenCity-Windows-x64 | Out-Null
          Copy-Item build/Release/open_city.exe dist/OpenCity-Windows-x64/open_city.exe
          Copy-Item README.md dist/OpenCity-Windows-x64/README.md
          Compress-Archive -Path dist/OpenCity-Windows-x64/* -DestinationPath OpenCity-Windows-x64.zip -Force

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCity-Windows-x64
          path: OpenCity-Windows-x64.zip

  publish-release:
    name: Update Latest GitHub Release (.exe)
    needs: [build-linux, build-windows]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenCity-Windows-x64
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: OpenCity-Linux-x64
          path: release-assets

      - name: Create or Update Release v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          TAG_NAME="v1.0.0"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          cat <<'EOF' > release_notes.md
          ### 바로 실행하기 (Windows 10 / 11)
          1. 아래 **Assets**에서 **`OpenCity-Windows-x64.zip`** 파일을 다운로드합니다.
          2. 압축을 풀고 **`open_city.exe`** 를 더블클릭하면 별도 설치 없이 바로 실행됩니다!

          ### v1.0.0 Ultra-Detail 도시·캐릭터·차량·운전석·생동감 풀 업그레이드
          - **1. 유기적 인체 조각 캐릭터 (블록 인형 탈피)**:
            - 둥근 두개골·턱선·귀·코·눈동자·눈썹·입(도주 시 패닉 표정)·자연스러운 둥근 헤어 돔 적용 (커스텀 모자/헬멧/왕관 7종·안경 4종 완벽 호환)
            - 허벅지·무릎 관절·종아리·투톤 스니커즈(흰색 미드솔·토캡)·둥근 어깨 삼각근·팔꿈치 관절·커프스·왼손 손목시계·벨트 버클·자켓 지퍼·경찰 어깨 무전기/파우치·SWAT 탄창 파우치/안테나 추가!
          - **2. 초정밀 자연 식생 & 센트럴 파크 광장**:
            - 4단 곡선 줄기·코코넛 3개·바람에 흔들리는 8개 2단 아치형 야자잎 야자수
            - 뿌리 버트레스·3갈래 가지·6엽 다층 수관 가로수 + 도시 전역 벚꽃/자카란다/단풍나무 가로수길
            - 센트럴 파크 십자 석재 산책로·다단 대리석 분수대 + 실시간 6갈래 포물선 물줄기·야간 수중 아쿠아 조명·4개 원형 꽃밭·빈티지 글로브 가로등!
          - **3. 고밀도 도시 옥상·네온 간판·거리 소품 디테일**:
            - 빌딩 옥상 회전식 트윈 HVAC 냉각팬·뉴욕 스타일 목재 고가 물탱크(4각 철골+원뿔 지붕)·위성 안테나·상가 모서리 수직 발광 네온 블레이드 간판
            - 가로등 플루티드 받침대·도로명 표지판·실시간 신호등 연동 보행자 신호기(WALK/STOP)·야간 볼류메트릭 조명 콘·소화전 은색 노즐·반사 띠 라바콘·버스정류장 야간 LED 천장등!
          - **4. 차량 외장 마이크로 디테일 & 1인칭 운전석·우천 와이퍼**:
            - 외장: 사이드미러 지지대·후면 거울·전면 호박색 방향지시 LED, 지붕 샤크핀 GPS 안테나, 스포츠카 측면 휀더 냉각 루버, 니트로 시 붉게 달아오르는 배기구 내부 코어, 후진 시 백색 후진등, 제동 시 상단 제3 브레이크등(CHMSL), 빗길 고속 주행 시 후륜 물보라 미스트 & 25% 이하 파손 시 엔진룸 불꽃 스파크!
            - 1인칭 운전석: 24세그먼트 원형 가죽 스티어링 휠·엄지 그립·아노다이징 패들 시프터, 10-LED 순차 RPM 시프트 라이트·트윈 디지털 게이지 링·원형 크롬 송풍구, GPS 내비게이션 지도/경찰 MDT·로터리 공조 다이얼 3개·기어봉·컵홀더, **`[U]` 우천 시 앞유리 위를 부드럽게 닦아내는 실시간 듀얼 와이퍼 애니메이션**!
          - **5. 살아 숨 쉬는 바다·항구·하늘 & 경찰 헬기 추격전**:
            - 해안가 파도에 일렁이는 5척의 요트·범선, 남동쪽 항구 정박 초대형 컨테이너 화물선, 해변과 공원 상공을 날갯짓하며 선회하는 갈매기 10마리, 상공 순항 여객기(항법등+비행운)
            - **수배 `★3` 이상 시 출동하는 SBPD 경찰 헬리콥터**: 고속 회전 메인/테일 로터·적청 경광등·플레이어를 추적하며 비추는 볼류메트릭 서치라이트 빔!
          - **6. 1인칭 총기 정밀 가공 & 3D 회전 탄피 배출**:
            - 피카티니 상부 레일·방아쇠 울 및 금속 방아쇠·발사 시 후퇴하는 우측 탄피 배출구/노리쇠·장전 손잡이·슬롯 머즐 브레이크·반사 방지 틴티드 홀로그램 렌즈
            - 사격 시 약실에서 우측으로 튀어 올라 회전하며 땅에 튕기는 **3D 금속 황동 탄피 & 12게이지 적색 산탄총 탄피** 물리 구현!
          EOF
          ls -la release-assets
          if gh release view "${TAG_NAME}" -R "${REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" release-assets/* --clobber -R "${REPO}"
          else
            gh release create "${TAG_NAME}" release-assets/* \
              -R "${REPO}" \
              --target "${SHA}" \
              --title "Open City C++ ${TAG_NAME} (Windows .exe & Linux)" \
              --notes-file release_notes.md
          fi

