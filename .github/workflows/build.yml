name: Build & Package (Windows .exe & Linux)

on:
  push:
    branches: [ main, "feat/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux x64 Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenGL & X11 dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev

      - name: Configure & Build (Release)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Run Simulation Unit Tests
        run: ctest --test-dir build --output-on-failure

      - name: Package Linux Binary
        run: |
          mkdir -p dist/OpenCity-Linux-x64
          cp build/open_city dist/OpenCity-Linux-x64/
          cp README.md dist/OpenCity-Linux-x64/
          tar -czf OpenCity-Linux-x64.tar.gz -C dist OpenCity-Linux-x64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCity-Linux-x64
          path: OpenCity-Linux-x64.tar.gz

  build-windows:
    name: Windows x64 Standalone .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake (MSVC x64 Release)
        run: cmake -B build -A x64

      - name: Build Standalone open_city.exe
        run: cmake --build build --config Release --parallel

      - name: Run Simulation Unit Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package OpenCity-Windows-x64.zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/OpenCity-Windows-x64 | Out-Null
          Copy-Item build/Release/open_city.exe dist/OpenCity-Windows-x64/open_city.exe
          Copy-Item README.md dist/OpenCity-Windows-x64/README.md
          Compress-Archive -Path dist/OpenCity-Windows-x64/* -DestinationPath OpenCity-Windows-x64.zip -Force

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCity-Windows-x64
          path: OpenCity-Windows-x64.zip

  publish-release:
    name: Update Latest GitHub Release (.exe)
    needs: [build-linux, build-windows]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenCity-Windows-x64
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: OpenCity-Linux-x64
          path: release-assets

      - name: Create or Update Release v0.6.0
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          TAG_NAME="v0.6.0"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          cat <<'EOF' > release_notes.md
          ### 바로 실행하기 (Windows 10 / 11)
          1. 아래 **Assets**에서 **`OpenCity-Windows-x64.zip`** 파일을 다운로드합니다.
          2. 압축을 풀고 **`open_city.exe`** 를 더블클릭하면 별도 설치 없이 바로 실행됩니다!

          ### v0.6.0 주요 업데이트 (어지러움 제로 1:1 정밀 에임 안정화 & 완전한 1인칭 FPS·운전석 시점 추가)
          - **어지러움 제로(`Zero-Dizziness`) 1:1 정밀 에임 & 카메라 안정화**:
            - 마우스 좌우(`Yaw`)와 상하(`Pitch`) 회전 지연을 완전히 제거해 **0ms 1:1 동기화 에임**을 구현하고, 보행 턱(`0.08m`) 이동만 수직 필터링해 멀미를 유발하던 위상 어긋남 해결
            - 우클릭(`RMB`) 정밀조준 시 과도하게 줌·어깨 이동이 동시에 튀던 **돌리 줌(Dolly-Zoom) 현상 제거** (일정한 어깨 오프셋 `0.40m` 유지 + 부드러운 초점 전환)
            - 기본 마우스 감도 안정화 + **우클릭 정밀조준 시 자동 감도 감속(`0.58x`)** + **`[` / `]` 키 실시간 마우스 감도 조절(`30% ~ 250%`)** + 커서 잠금 시 마우스 튀는 현상 방지 가드 적용
            - 사격할 때마다 십자선이 번쩍이며 벌어지던 눈 피로 요소를 제거하고 고대비 안정형 조준선 & 정밀 집탄율 개선
          - **`[V]` (또는 마우스 휠클릭) 1인칭 / 3인칭 시점 즉시 전환 (`FPS 도보 + 3D 차량 운전석`)**:
            - **1인칭 도보 FPS 시점**: 수평선 흔들림(Head-Bob) 제로 설계 + 의상 소매·양손이 반영된 **무기 7종 전용 3D 뷰모델** (권총 트리튬 가늠쇠, SMG 시안 리플렉스, 샷건 광섬유 비드, 소총 레드닷 홀로그램, 중기관총 그린 도트, 런처 쿼드런트 조준기) 탑재! 우클릭 시 화면 정중앙으로 **정축(Co-Axial) 광학 조준(ADS)** 정렬
            - **1인칭 3D 차량 운전석(Cockpit) 시점**: 10종 전 차량 좌핸들 운전석 시야, 조향각에 맞춰 **실시간 회전하는 3D 스포츠 스티어링 휠 & 양손**, 디지털 속도·RPM 클러스터, 경찰차 전용 전술 단말기(`MDT`), 유선형 클리어코트 보닛(머슬카 V8 슈퍼차저 스쿱·경찰 푸시범퍼 포함) 구현 (`F3` 키로 그래픽 프리셋 변경)
          EOF
          ls -la release-assets
          if gh release view "${TAG_NAME}" -R "${REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" release-assets/* --clobber -R "${REPO}"
          else
            gh release create "${TAG_NAME}" release-assets/* \
              -R "${REPO}" \
              --target "${SHA}" \
              --title "Open City C++ ${TAG_NAME} (Windows .exe & Linux)" \
              --notes-file release_notes.md
          fi
